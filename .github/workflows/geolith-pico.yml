name: Neo Geo Geolith port probes
on:
  workflow_dispatch:
  push:
    branches: [extended/lynx]
    paths:
      - 'cores/geolith-pico/**'
      - '.github/workflows/geolith-pico.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [host, arm-linux-soft]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: libretro/geolith-libretro
          ref: 846c5b541b42c122105b2a1bb29830ba03e93058
          path: geo-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.arch == 'arm-linux-soft'
        with:
          repository: madler/zlib
          ref: v1.3.1
          path: zlib-upstream
          persist-credentials: false
      - name: Install test compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi qemu-user zlib1g-dev
          if [ "${{ matrix.arch }}" = arm-linux-soft ]; then
            cd zlib-upstream
            CC="arm-linux-gnueabi-gcc" CFLAGS="-O2 -fPIC -march=armv7-a -mfloat-abi=soft -marm" ./configure --static --prefix="$RUNNER_TEMP/zlib-arm"
            make -j2
            make install
            echo "CPATH=$RUNNER_TEMP/zlib-arm/include" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=$RUNNER_TEMP/zlib-arm/lib" >> "$GITHUB_ENV"
          fi
      - name: Compile and test original synthetic cartridge
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          CC=gcc
          FLAGS=""
          if [ "$ARCH" = arm-linux-soft ]; then
            CC=arm-linux-gnueabi-gcc
            FLAGS="-march=armv7-a -mfloat-abi=soft -marm"
            test -s "$RUNNER_TEMP/zlib-arm/lib/libz.a"
            printf '#include <zlib.h>\nint main(void){return zlibVersion()==0;}\n' | "$CC" $FLAGS -I"$RUNNER_TEMP/zlib-arm/include" -x c - -x none "$RUNNER_TEMP/zlib-arm/lib/libz.a" -o "$RUNNER_TEMP/zlib-probe"
            qemu-arm -L /usr/arm-linux-gnueabi "$RUNNER_TEMP/zlib-probe"
            # Cross GCC does not reliably honor LIBRARY_PATH. Pass explicit search paths.
            printf '#!/bin/sh\nexec arm-linux-gnueabi-gcc -I"%s/include" -L"%s/lib" "$@"\n' "$RUNNER_TEMP/zlib-arm" "$RUNNER_TEMP/zlib-arm" > "$RUNNER_TEMP/geo-arm-cc"
            chmod +x "$RUNNER_TEMP/geo-arm-cc"
            CC="$RUNNER_TEMP/geo-arm-cc"
          fi
          "$CC" $FLAGS -std=c11 -Wall -Wextra -Werror cores/geolith-pico/arena.c cores/geolith-pico/arena_test.c -o "$RUNNER_TEMP/geo-arena-test"
          if [ "$ARCH" = host ]; then
            "$RUNNER_TEMP/geo-arena-test"
          else
            qemu-arm -L /usr/arm-linux-gnueabi "$RUNNER_TEMP/geo-arena-test"
          fi
          "$CC" $FLAGS -std=c11 -Wall -Wextra -Werror cores/geolith-pico/arena.c cores/geolith-pico/native_heap.c cores/geolith-pico/native_heap_test.c -o "$RUNNER_TEMP/geo-heap-test"
          if [ "$ARCH" = host ]; then
            "$RUNNER_TEMP/geo-heap-test"
          else
            qemu-arm -L /usr/arm-linux-gnueabi "$RUNNER_TEMP/geo-heap-test"
          fi
          make -C geo-upstream/libretro -j2 platform=unix CC="$CC" EXTRA_INCLUDES="$FLAGS"
          python3 cores/geolith-pico/fixture.py "$RUNNER_TEMP/geo-fixture"
          "$CC" $FLAGS -std=c99 -Wall -Wextra -Igeo-upstream/libretro \
            cores/geolith-pico/neo_format.c cores/geolith-pico/smoke.c \
            "$PWD/geo-upstream/libretro/geolith_libretro.so" -Wl,-rpath,"$PWD/geo-upstream/libretro" -o "$RUNNER_TEMP/geo-smoke"
          if [ "$ARCH" = host ]; then
            timeout 90s "$RUNNER_TEMP/geo-smoke" "$RUNNER_TEMP/geo-fixture"
          else
            arm-linux-gnueabi-readelf -h "$RUNNER_TEMP/geo-smoke"
            timeout 120s qemu-arm -L /usr/arm-linux-gnueabi "$RUNNER_TEMP/geo-smoke" "$RUNNER_TEMP/geo-fixture"
          fi
  native-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: libretro/geolith-libretro
          ref: 846c5b541b42c122105b2a1bb29830ba03e93058
          path: geo-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: madler/zlib
          ref: v1.3.1
          path: zlib-upstream
          persist-credentials: false
      - name: Install bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi
      - name: Build native static zlib
        run: |
          set -eu
          cd zlib-upstream
          # The engine needs the in-memory compression API, not gzFile stdio.
          # Avoid configure's bare-metal link probes selecting unsafe vsprintf.
          flags="-Os -march=armv7-a -mfloat-abi=soft -marm"
          for src in adler32 crc32 deflate infback inffast inflate inftrees trees zutil compress uncompr; do
            arm-none-eabi-gcc $flags -I. -c "$src.c" -o "$src.o"
          done
          arm-none-eabi-ar rcs libz.a adler32.o crc32.o deflate.o infback.o inffast.o inflate.o inftrees.o trees.o zutil.o compress.o uncompr.o
          arm-none-eabi-nm -u libz.a > "$RUNNER_TEMP/zlib-imports.txt"
          if grep -Eq '[[:space:]](vsprintf|sprintf|gzprintf|gzvprintf)$' "$RUNNER_TEMP/zlib-imports.txt"; then
            echo "Unsafe or unexpected formatted I/O in native zlib" >&2
            exit 1
          fi
          arm-none-eabi-nm --defined-only libz.a > "$RUNNER_TEMP/zlib-symbols.txt"
          for symbol in inflate deflate compress uncompress crc32; do
            grep -Eq "[[:space:]]T[[:space:]]$symbol$" "$RUNNER_TEMP/zlib-symbols.txt"
          done
          mkdir -p "$RUNNER_TEMP/zlib-native/lib" "$RUNNER_TEMP/zlib-native/include"
          cp libz.a "$RUNNER_TEMP/zlib-native/lib/"
          cp zlib.h zconf.h "$RUNNER_TEMP/zlib-native/include/"
      - name: Compile native engine and inventory unresolved imports
        run: python3 cores/geolith-pico/native_objects.py geo-upstream "$RUNNER_TEMP/geolith-native" "$RUNNER_TEMP/zlib-native"
      - uses: actions/upload-artifact@v4
        with:
          name: Geolith-native-engine-inventory-NOT-FOR-FLASHING
          path: ${{ runner.temp }}/geolith-native/undefined.txt
          if-no-files-found: error
