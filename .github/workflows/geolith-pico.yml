name: Neo Geo Geolith port probes
on:
  workflow_dispatch:
  push:
    branches: [extended/lynx]
    paths:
      - 'cores/geolith-pico/**'
      - 'emu/gba/fat_ro.*'
      - 'emu/gba/fat_exfat.*'
      - '.github/workflows/geolith-pico.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [host, arm-linux-soft]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: libretro/geolith-libretro
          ref: 846c5b541b42c122105b2a1bb29830ba03e93058
          path: geo-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.arch == 'arm-linux-soft'
        with:
          repository: madler/zlib
          ref: v1.3.1
          path: zlib-upstream
          persist-credentials: false
      - name: Install test compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi qemu-user zlib1g-dev dosfstools mtools
          if [ "${{ matrix.arch }}" = arm-linux-soft ]; then
            cd zlib-upstream
            CC="arm-linux-gnueabi-gcc" CFLAGS="-O2 -fPIC -march=armv7-a -mfloat-abi=soft -marm" ./configure --static --prefix="$RUNNER_TEMP/zlib-arm"
            make -j2
            make install
            echo "CPATH=$RUNNER_TEMP/zlib-arm/include" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=$RUNNER_TEMP/zlib-arm/lib" >> "$GITHUB_ENV"
          fi
      - name: Test real FAT cartridge bridge
        if: matrix.arch == 'host'
        run: bash cores/geolith-pico/test_sd_cart.sh
      - name: Compile and test original synthetic cartridge
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          CC=gcc
          FLAGS=""
          if [ "$ARCH" = arm-linux-soft ]; then
            CC=arm-linux-gnueabi-gcc
            FLAGS="-march=armv7-a -mfloat-abi=soft -marm"
            test -s "$RUNNER_TEMP/zlib-arm/lib/libz.a"
            printf '#include <zlib.h>\nint main(void){return zlibVersion()==0;}\n' | "$CC" $FLAGS -I"$RUNNER_TEMP/zlib-arm/include" -x c - -x none "$RUNNER_TEMP/zlib-arm/lib/libz.a" -o "$RUNNER_TEMP/zlib-probe"
            qemu-arm -L /usr/arm-linux-gnueabi "$RUNNER_TEMP/zlib-probe"
            # Cross GCC does not reliably honor LIBRARY_PATH. Pass explicit search paths.
            printf '#!/bin/sh\nexec arm-linux-gnueabi-gcc -I"%s/include" -L"%s/lib" "$@"\n' "$RUNNER_TEMP/zlib-arm" "$RUNNER_TEMP/zlib-arm" > "$RUNNER_TEMP/geo-arm-cc"
            chmod +x "$RUNNER_TEMP/geo-arm-cc"
            CC="$RUNNER_TEMP/geo-arm-cc"
          fi
          if [ "$ARCH" = arm-linux-soft ]; then
            CC="$CC" CFLAGS="$FLAGS" GEO_TEST_ARM=1 bash cores/geolith-pico/test_sd_cart.sh
          fi
          "$CC" $FLAGS -std=c11 -Wall -Wextra -Werror cores/geolith-pico/arena.c cores/geolith-pico/arena_test.c -o "$RUNNER_TEMP/geo-arena-test"
          if [ "$ARCH" = host ]; then
            "$RUNNER_TEMP/geo-arena-test"
          else
            qemu-arm -L /usr/arm-linux-gnueabi "$RUNNER_TEMP/geo-arena-test"
          fi
          "$CC" $FLAGS -std=c11 -Wall -Wextra -Werror cores/geolith-pico/arena.c cores/geolith-pico/native_heap.c cores/geolith-pico/native_heap_test.c -o "$RUNNER_TEMP/geo-heap-test"
          if [ "$ARCH" = host ]; then
            "$RUNNER_TEMP/geo-heap-test"
          else
            qemu-arm -L /usr/arm-linux-gnueabi "$RUNNER_TEMP/geo-heap-test"
          fi
          "$CC" $FLAGS -std=c11 -Wall -Wextra -Werror cores/geolith-pico/neo_format.c cores/geolith-pico/cart_io.c cores/geolith-pico/cart_io_test.c -o "$RUNNER_TEMP/geo-cart-test"
          if [ "$ARCH" = host ]; then
            "$RUNNER_TEMP/geo-cart-test"
          else
            qemu-arm -L /usr/arm-linux-gnueabi "$RUNNER_TEMP/geo-cart-test"
          fi
          make -C geo-upstream/libretro -j2 platform=unix CC="$CC" EXTRA_INCLUDES="$FLAGS"
          python3 cores/geolith-pico/fixture.py "$RUNNER_TEMP/geo-fixture"
          truncate -s 64M "$RUNNER_TEMP/geo-runtime.img"
          mkfs.fat -F 32 "$RUNNER_TEMP/geo-runtime.img"
          mmd -i "$RUNNER_TEMP/geo-runtime.img" ::/roms ::/roms/neo ::/bios
          mcopy -i "$RUNNER_TEMP/geo-runtime.img" "$RUNNER_TEMP/geo-fixture/test.neo" ::/roms/neo/
          mcopy -i "$RUNNER_TEMP/geo-runtime.img" "$RUNNER_TEMP/geo-fixture/neogeo.zip" ::/bios/
          mcopy -i "$RUNNER_TEMP/geo-runtime.img" "$RUNNER_TEMP/geo-fixture/aes.zip" ::/bios/
          rm "$RUNNER_TEMP/geo-fixture/test.neo" "$RUNNER_TEMP/geo-fixture/neogeo.zip" "$RUNNER_TEMP/geo-fixture/aes.zip"
          "$CC" $FLAGS -std=c99 -Wall -Wextra -Igeo-upstream/libretro \
            cores/geolith-pico/{neo_format,smoke,sd_cart,cart_io,geo_zlib}.c emu/gba/{fat_ro,fat_exfat}.c \
            "$PWD/geo-upstream/libretro/geolith_libretro.so" -Wl,-rpath,"$PWD/geo-upstream/libretro" -lz -o "$RUNNER_TEMP/geo-smoke"
          if [ "$ARCH" = host ]; then
            timeout 90s "$RUNNER_TEMP/geo-smoke" "$RUNNER_TEMP/geo-fixture" "$RUNNER_TEMP/geo-runtime.img"
          else
            arm-linux-gnueabi-readelf -h "$RUNNER_TEMP/geo-smoke"
            timeout 120s qemu-arm -L /usr/arm-linux-gnueabi "$RUNNER_TEMP/geo-smoke" "$RUNNER_TEMP/geo-fixture" "$RUNNER_TEMP/geo-runtime.img"
          fi
  native-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: libretro/geolith-libretro
          ref: 846c5b541b42c122105b2a1bb29830ba03e93058
          path: geo-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: madler/zlib
          ref: v1.3.1
          path: zlib-upstream
          persist-credentials: false
      - name: Install bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi qemu-user
      - name: Build native static zlib
        run: |
          set -eu
          cd zlib-upstream
          # The engine needs the in-memory compression API, not gzFile stdio.
          # Avoid configure's bare-metal link probes selecting unsafe vsprintf.
          flags="-Os -march=armv7-a -mfloat-abi=soft -marm"
          for src in adler32 crc32 deflate infback inffast inflate inftrees trees zutil compress uncompr; do
            arm-none-eabi-gcc $flags -I. -c "$src.c" -o "$src.o"
          done
          arm-none-eabi-ar rcs libz.a adler32.o crc32.o deflate.o infback.o inffast.o inflate.o inftrees.o trees.o zutil.o compress.o uncompr.o
          arm-none-eabi-nm -u libz.a > "$RUNNER_TEMP/zlib-imports.txt"
          if grep -Eq '[[:space:]](vsprintf|sprintf|gzprintf|gzvprintf)$' "$RUNNER_TEMP/zlib-imports.txt"; then
            echo "Unsafe or unexpected formatted I/O in native zlib" >&2
            exit 1
          fi
          arm-none-eabi-nm --defined-only libz.a > "$RUNNER_TEMP/zlib-symbols.txt"
          for symbol in inflate deflate compress uncompress crc32; do
            grep -Eq "[[:space:]]T[[:space:]]$symbol$" "$RUNNER_TEMP/zlib-symbols.txt"
          done
          mkdir -p "$RUNNER_TEMP/zlib-native/lib" "$RUNNER_TEMP/zlib-native/include"
          cp libz.a "$RUNNER_TEMP/zlib-native/lib/"
          cp zlib.h zconf.h "$RUNNER_TEMP/zlib-native/include/"
      - name: Compile bounded cartridge reader and native ZIP adapter
        run: |
          set -eu
          for src in neo_format cart_io sd_cart; do
            arm-none-eabi-gcc -march=armv7-a -mfloat-abi=soft -marm -std=c11 -Wall -Wextra -Werror -ffreestanding -c "cores/geolith-pico/$src.c" -o "$RUNNER_TEMP/$src.o"
          done
          arm-none-eabi-gcc -march=armv7-a -mfloat-abi=soft -marm -std=c11 -Wall -Wextra -Werror -ffreestanding -I"$RUNNER_TEMP/zlib-native/include" -c cores/geolith-pico/geo_zlib.c -o "$RUNNER_TEMP/geo_zlib.o"
          arm-none-eabi-ld -r -o "$RUNNER_TEMP/geo-zip-zlib-linked.o" "$RUNNER_TEMP/geo_zlib.o" "$RUNNER_TEMP/zlib-native/lib/libz.a"
          arm-none-eabi-nm --defined-only "$RUNNER_TEMP/geo-zip-zlib-linked.o" | grep -F ' geo_zip_zlib_raw_inflate'
          if arm-none-eabi-nm -u "$RUNNER_TEMP/geo-zip-zlib-linked.o" | grep -E ' U (inflate|inflateInit2_|inflateEnd)'; then
            echo "Native ZIP adapter still has unresolved inflate imports" >&2
            exit 1
          fi
      - name: Compile native engine and inventory unresolved imports
        run: python3 cores/geolith-pico/native_objects.py geo-upstream "$RUNNER_TEMP/geolith-native" "$RUNNER_TEMP/zlib-native"
      - name: Execute real newlib allocator on ARM Linux syscall harness
        run: |
          set -eu
          arm-none-eabi-gcc -march=armv7-a -mfloat-abi=soft -marm -nostdlib -static -Wl,-e,_start -Wl,-Ttext=0x10000 -o "$RUNNER_TEMP/geo-newlib-run" cores/geolith-pico/newlib_test_start.S "$RUNNER_TEMP/geolith-native/newlib-allocator-linked.o"
          timeout 30s qemu-arm "$RUNNER_TEMP/geo-newlib-run"
          echo 'Real newlib allocator execution passed'
      - uses: actions/upload-artifact@v4
        with:
          name: Geolith-native-engine-inventory-NOT-FOR-FLASHING
          path: |
            ${{ runner.temp }}/geolith-native/undefined.txt
            ${{ runner.temp }}/geolith-native/session-imports.txt
            ${{ runner.temp }}/geolith-native/storage-imports.txt
            ${{ runner.temp }}/geolith-native/libc-imports.txt
            ${{ runner.temp }}/geolith-native/newlib-allocator-imports.txt
          if-no-files-found: error

