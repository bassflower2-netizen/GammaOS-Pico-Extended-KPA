name: Extended KPA integration build
on:
  workflow_dispatch:
  push:
    branches: [extended/lynx]
    paths:
      - '.github/workflows/extended-kpa.yml'
      - '.gitmodules'
      - 'cores/**'
      - 'emu/**'
      - 'tools/**'
      - 'build_konkr_kpa.sh'
      # The complete integration package now requires the tested Handy blob.
permissions:
  contents: read
jobs:
  build:
    # Match the upstream core CI: GCC 10.3-2021.07 and newlib 3.3.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: libretro/libretro-handy
          ref: bc55d462f0b2d6b073ea93dc552ebd73cec60fd1
          path: handy-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: libretro/beetle-pce-fast-libretro
          ref: 4cf066e22533186d0cfad85a0fec2aced93e4e29
          path: pce-upstream
          persist-credentials: false
      - name: Install toolchains and asset dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y make python3 python-is-python3 python3-pil python3-fonttools python3-numpy python3-cairosvg python3-venv openssl ca-certificates libc6:i386 lib32z1 lib32stdc++6 gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev libstdc++-arm-none-eabi-newlib binutils-arm-none-eabi patch qemu-user dosfstools mtools
          arm-none-eabi-gcc --version
          arm-none-eabi-g++ --version
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/pico-python"
          "$RUNNER_TEMP/pico-python/bin/python" -m pip install --disable-pip-version-check 'arabic-reshaper==3.0.0' 'python-bidi==0.4.2'
          "$RUNNER_TEMP/pico-python/bin/python" -c 'import cairosvg, PIL, fontTools, numpy, arabic_reshaper, bidi'
          echo "$RUNNER_TEMP/pico-python/bin" >> "$GITHUB_PATH"
      - name: Test CD SD bridge on real FAT16 and FAT32 images
        run: bash emu/pce/test_sd_io.sh
      - name: Build original emulator cores with full compiler output
        run: |
          set -eu
          failed=0
          for dir in armGBA-pico gpsp-pico gambatte-pico snes9x-pico armSNES-pico genesis-plus-gx-pico armNES-pico; do
            echo "::group::Build $dir"
            if (cd "cores/$dir" && bash build.sh && git rev-parse HEAD > out/.built-commit); then
              echo "Core $dir built successfully"
            else
              echo "::error::Core $dir failed; see compiler output above"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Build and test exact Handy blob for the SD package
        run: bash cores/handy-pico/build_arm_probe.sh handy-upstream "$RUNNER_TEMP/handy-arm-probe"
      - name: Build and test exact PCE blob for the SD package
        run: PCE_CD_PROBE=1 bash cores/pce-fast-pico/build_arm_probe.sh pce-upstream "$RUNNER_TEMP/pce-native"
      - name: Build KPA bootloader and SD card
        run: PCE_BLOB="$RUNNER_TEMP/pce-native/pce-fast-pico.blob" HANDY_BLOB="$RUNNER_TEMP/handy-arm-probe/handy-pico.blob" bash build_konkr_kpa.sh
      - name: Validate complete baseline output
        run: |
          set -eu
          test -s out/lk_a_kpa_signed.img
          test -s build-k85v1_64_kpa/emu/lynx/handy_core_loader.o
          test -s build-k85v1_64_kpa/emu/lynx/handy_sd_run.o
          cmp "$RUNNER_TEMP/handy-arm-probe/handy-pico.blob" out/sdcard/cores/handy-pico.blob
          test -d out/sdcard/roms/lynx
          test -d out/sdcard/roms/pce
          test -d out/sdcard/roms/pcecd
          grep -q "api->open_cd(cue" emu/pce/pce_sd_run.c
          grep -q "GBA_CONSOLE_PCECD" emu/gba/pico_current.c
          grep -q "GBA_CONSOLE_PCECD" emu/gba/sd_fat.c
          test -s build-k85v1_64_kpa/emu/pce/pce_core_loader.o
          test -s build-k85v1_64_kpa/emu/neo/geo_core_loader.o
          test -s build-k85v1_64_kpa/emu/neo/geo_video.o
          test -s build-k85v1_64_kpa/emu/pce/pce_sd_run.o
          test -s build-k85v1_64_kpa/emu/pce/pce_sd_io.o
          cmp "$RUNNER_TEMP/pce-native/pce-fast-pico.blob" out/sdcard/cores/pce-fast-pico.blob
          test -s out/pce_logo.png
          test -s out/sdcard/gammaos/menu.pack
          test -s out/sdcard/gammaos/current-960x640.pack
          test -s out/sdcard/gammaos/current-igm-960x640.pack
          test -s out/sdcard/gammaos/names.pack
          test -s out/sdcard/bios/certs/roots.der
          for core in armgba-pico gpsp-pico gambatte-pico snes9x-pico armsnes-pico genesis-plus-gx-pico armnes-pico ra-pico; do
            test -s "out/sdcard/cores/$core.blob" || { echo "::error::Missing core $core"; exit 1; }
          done
      - name: Check Lynx source integration and asset generation
        run: |
          python3 -m py_compile tools/ayaneo/pico_current/lynx_art.py tools/ayaneo/pico_current/build_pack.py tools/ayaneo/snes/pack_snes.py
          test -s out/lynx_logo.png
          grep -q 'GBA_CONSOLE_LYNX.*"lynx atarilynx"' emu/gba/sd_fat.c
          grep -q 'logo_lynx' emu/gba/gba_snes_menu.c
          grep -q 'Atari Lynx' emu/gba/pico_current.c
      - uses: actions/upload-artifact@v4
        with:
          name: Extended-KPA-LYNX-PCE-PCECD-ALPHA-UNTESTED
          path: |
            out/lk_a_kpa_signed.img
            out/sdcard/
          if-no-files-found: error
